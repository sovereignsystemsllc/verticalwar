<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOVEREIGN OS // TRANSMISSIONS</title>

    <!-- PURE V4 STACK -->
    <link rel="stylesheet" href="/src/style.css">
    <style>
        /* Video Aspect Ratio Hack for iframes */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Scanline Override for Video readability if needed */
        .video-container { z-index: 10; }
    </style>
</head>

<body
    class="bg-matrix-bg text-matrix-text font-mono min-h-screen flex lg:pl-64 selection:bg-matrix-green selection:text-black">

    <!-- GLOBAL SIDEBAR NAVIGATION -->
    <div id="sidebar-container" class="shrink-0 z-50"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">

        <!-- CRT SCANLINE -->
        <div class="scanline-overlay pointer-events-none"></div>

        <!-- STICKY HEADER -->
        <header
            class="w-full h-16 sm:h-20 border-b border-matrix-border px-4 sm:px-8 flex justify-between items-center bg-matrix-bg/90 backdrop-blur-sm z-40 shrink-0">
            <div class="flex items-center gap-3 sm:gap-4">
                <!-- Mobile Menu Toggle -->
                <button id="mobile-menu-btn" class="md:hidden text-matrix-green hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <h1 class="text-lg sm:text-2xl text-white font-bold tracking-widest uppercase truncate flex items-center gap-2">
                    <svg class="w-6 h-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                    Transmissions
                </h1>
            </div>
            
            <!-- Filters & Controls -->
            <div class="flex items-center gap-2 sm:gap-4">
                <select id="cat-filter" class="hidden sm:block bg-matrix-panel border border-matrix-border text-xs text-matrix-muted px-2 py-1 uppercase tracking-widest focus:outline-none focus:border-red-500">
                    <option value="">ALL CATEGORIES</option>
                    <option value="MONOLOGUE">MONOLOGUE</option>
                    <option value="TUTORIAL">TUTORIAL</option>
                    <option value="DOCUMENTARY">DOCUMENTARY</option>
                    <option value="TRANSMISSION">TRANSMISSION</option>
                </select>
                <div class="hidden sm:flex items-center border border-matrix-border bg-matrix-panel px-3 py-1">
                    <span class="text-[10px] text-matrix-green mr-2 animate-pulse">●</span>
                    <span class="text-xs text-matrix-muted tracking-widest uppercase">SECURE FEED</span>
                </div>
            </div>
        </header>

        <!-- SCROLLABLE FEED -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-8 lg:p-12 relative z-30 pb-32">
            <div class="max-w-4xl mx-auto flex flex-col gap-12" id="video-feed">
                <!-- Loader -->
                <div class="w-full flex justify-center py-20">
                    <div class="flex flex-col items-center gap-4">
                        <svg class="w-8 h-8 text-red-500 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <span class="text-xs text-matrix-muted tracking-widest uppercase animate-pulse">Decrypting Feed...</span>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed bottom-8 right-8 z-50 hidden rounded-sm px-6 py-4 border shadow-2xl backdrop-blur-xl opacity-0 text-sm font-semibold text-white pointer-events-none flex items-center gap-3 transition-opacity duration-300 bg-matrix-panel/80 border-matrix-border text-matrix-muted uppercase tracking-widest">
        <span id="toast-msg"></span>
    </div>

    <!-- MAIN LOGIC -->
    <script type="module" src="./videos.js"></script>
    <script type="module" src="/src/sidebar.js"></script>

    <!-- TELEMETRY -->
    <script type="module">
        import { trackPageview } from '/src/telemetry.js';
        trackPageview();
    </script>
</body>

</html>
