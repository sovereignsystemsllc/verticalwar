<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GAS STATION LOG // SOVEREIGN SYSTEM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/src/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-[var(--c-void)] text-[var(--c-primary)] flex flex-col p-4 md:p-8">
  <div class="scanline-overlay pointer-events-none"></div>

  <nav class="w-full flex justify-between items-center py-4 border-b border-[var(--c-primary)]/30 mb-12">
    <a href="/" class="text-[10px] font-bold tracking-widest uppercase hover:text-white transition-colors">< RETURN TO BORDER</a>
    <span class="text-[9px] tracking-widest uppercase opacity-50">LOG TERMINAL // SECURE</span>
  </nav>

  <main class="w-full max-w-2xl mx-auto flex-1">
    <header class="mb-12 border-l-2 border-[var(--c-primary)] pl-6 animate-breathe">
      <h1 class="text-3xl font-bold uppercase tracking-widest">
        Gas Station Log
      </h1>
      <p class="text-xs tracking-widest uppercase opacity-70 font-mono mt-2">
        Short-form thoughts, signals, and existential transmissions.
      </p>
    </header>

    <div class="space-y-8 relative before:absolute before:inset-0 before:w-px before:bg-[var(--c-primary)]/20 before:ml-2">
      
      <!-- LOG ENTRY (Awaiting Operator Content) -->
      <article class="relative pl-10">
        <div class="absolute w-4 h-4 rounded-full bg-[var(--c-void)] border border-[var(--c-primary)] left-0 top-1 shadow-[0_0_10px_rgba(var(--c-primary-rgb),0.5)]"></div>
        <div class="glass-panel p-6 animate-pulse-glow">
          <time class="block text-[10px] font-mono tracking-widest text-[var(--c-primary)]/60 mb-3">SYSTEM INITIATION</time>
          <div class="text-white/80 text-sm leading-relaxed">
            [ AWAITING SYNTHESIS FROM FRAGMENTS WORKSPACE ]
          </div>
        </div>
      </article>

    </div>
  </main>
</body>
</html>
