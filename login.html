<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Gate // Access Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/src/style.css">
</head>

<body class="bg-[#05010a] text-[#a78bfa] min-h-screen font-mono flex items-center justify-center p-8">
    <!-- CRT SCANLINE (RIKA AESTHETIC) -->
    <div class="scanline-overlay"></div>

    <div class="max-w-md w-full border border-[#a78bfa]/40 p-8 glass-panel relative z-10">
        <div class="flex items-center gap-3 mb-8 border-b border-[#a78bfa]/20 pb-6">
            <div class="w-2 h-2 bg-[#a78bfa] animate-pulse rounded-full"></div>
            <h1 class="text-xl font-bold tracking-[0.2em] uppercase text-white">SOVEREIGN GATE</h1>
        </div>
        <div id="loginError"
            class="text-red-500 mb-4 hidden font-bold text-xs tracking-widest uppercase border border-red-500/30 p-2">
        </div>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-[10px] text-[#a78bfa]/70 mb-1 tracking-widest uppercase">Operator Email</label>
                <input type="email" id="email"
                    class="w-full bg-transparent border border-[#a78bfa]/30 text-[#a78bfa] p-2 focus:outline-none focus:border-[#a78bfa] font-mono text-sm"
                    placeholder="identification@verticalwar.com" required>
            </div>
            <div>
                <label class="block text-[10px] text-[#a78bfa]/70 mb-1 tracking-widest uppercase">Decryption Key</label>
                <input type="password" id="password"
                    class="w-full bg-transparent border border-[#a78bfa]/30 text-[#a78bfa] p-2 focus:outline-none focus:border-[#a78bfa] font-mono text-sm"
                    placeholder="••••••••••••••••" required>
            </div>
            <button type="submit"
                class="w-full border border-[#a78bfa] bg-[#a78bfa]/10 hover:bg-[#a78bfa] text-[#a78bfa] hover:text-black font-bold uppercase tracking-widest py-2 transition-all mt-4 text-sm">
                INITIATE OVERRIDE
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="/"
                class="text-[10px] text-[#a78bfa]/40 hover:text-[#a78bfa] tracking-widest uppercase transition-colors">←
                RETURN TO CODEX</a>
        </div>
    </div>
    <script type="module" src="/src/login.js"></script>
</body>

</html>
