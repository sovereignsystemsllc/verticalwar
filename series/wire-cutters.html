<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>THE WIRE CUTTERS // SOVEREIGN SYSTEM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/src/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }

    /* =========================================
       ADMIN CONTROL BLOCK: SERIES BRANDING
       Swap these URLs to change the graphics globally 
       without touching the complex HTML structure below.
       ========================================= */
    :root {
      --series-hero-img: url('https://via.placeholder.com/1200x400/05010a/ea580c?text=[+HERO+GRAPHIC+SLOT+]');
      --series-watermark-img: url('https://via.placeholder.com/400x800/ea580c/05010a?text=[+VERTICAL+GRAPHIC+]');
      --series-diagram-img: url('https://via.placeholder.com/800x450/0a0501/ea580c?text=[+DIAGRAM/CONCEPT+ART+]');
    }
    
    .bg-hero { background-image: var(--series-hero-img); }
    .bg-watermark { background-image: var(--series-watermark-img); }
    .bg-diagram { background-image: var(--series-diagram-img); }
  </style>
  <script>
    /* --- ADMIN CONTROL: AUDIO TRANSMISSION --- */
    // Paste an mp3 url here. If left blank (""), the player hides.
    window.SERIES_AUDIO_TRACK = ""; 
  </script>
</head>
<body data-theme="rust" class="pl-0 lg:pl-64 transition-all duration-300 min-h-screen bg-[var(--c-void)] text-[var(--c-primary)] flex flex-col p-4 md:p-8">
  <div class="scanline-overlay pointer-events-none"></div>

  <!-- NAVIGATION -->
  <nav class="w-full flex justify-between items-center py-4 border-b border-[var(--c-primary)]/30 mb-8 md:mb-16">
    <a href="/" class="text-[10px] font-bold tracking-widest uppercase hover:text-white transition-colors">< RETURN TO BORDER</a>
    <span class="text-[9px] tracking-widest uppercase opacity-50">SERIES BRIDGE // SECURE</span>
  </nav>

  <main class="w-full max-w-5xl mx-auto flex-1 flex flex-col items-center">
    
    <!-- AUDIO PLAYER CONTAINER -->
    <div id="audio-container" class="w-full max-w-4xl mb-6 hidden items-center gap-4 bg-[#0a0501]/80 border border-[var(--c-primary)]/20 px-4 py-2 shadow-[0_0_15px_rgba(var(--c-primary-rgb),0.1)]">
      <div class="w-2 h-2 bg-[var(--c-primary)] rounded-full animate-pulse shadow-[0_0_8px_rgba(var(--c-primary-rgb),0.8)]"></div>
      <span class="text-[9px] font-mono tracking-widest uppercase text-[var(--c-primary)] opacity-80">BACKGROUND SIGNAL</span>
      <audio id="series-audio" controls loop class="h-6 flex-1 opacity-50 grayscale invert sepia-[.5] hue-rotate-180"></audio>
    </div>

    <!-- HERO GRAPHIC SLOT -->
    <div class="w-full max-w-4xl aspect-[21/9] lg:aspect-[3/1] mb-10 overflow-hidden border border-[var(--c-primary)]/20 shadow-[0_0_30px_rgba(var(--c-primary-rgb),0.1)] relative group bg-hero bg-cover bg-center">
      <div class="absolute inset-0 bg-gradient-to-t from-[var(--c-void)] to-transparent opacity-80 z-10 transition-opacity duration-500 group-hover:opacity-40"></div>
    </div>

    <header class="mb-12 text-center animate-breathe w-full relative z-20 -mt-16 md:-mt-24">
      <div class="w-2 h-2 bg-[var(--c-primary)] rounded-full mx-auto mb-6 shadow-[0_0_15px_rgba(var(--c-primary-rgb),0.8)]"></div>
      <h1 class="text-4xl md:text-6xl lg:text-7xl font-bold uppercase tracking-widest mb-4 drop-shadow-[0_0_20px_rgba(var(--c-primary-rgb),0.4)]">
        The Wire Cutters
      </h1>
      <p class="text-xs md:text-sm tracking-widest uppercase opacity-70 font-mono mt-6">
        Breaking the engineered learned helplessness of Layer 3.
      </p>
    </header>

    <div class="glass-panel p-8 md:p-12 w-full animate-pulse-glow max-w-4xl border relative overflow-hidden">
      <!-- SIDEBAR GRAPHIC / WATERMARK SLOT -->
      <div class="absolute top-0 right-0 w-64 h-full pointer-events-none opacity-20 hidden lg:block bg-watermark bg-cover bg-center">
        <div class="absolute inset-0 bg-gradient-to-l from-transparent to-[var(--c-void)]"></div>
      </div>

      <div id="fragment-container" class="prose prose-invert max-w-2xl text-white/90 text-center md:text-left py-8 relative z-10">
        <!-- OPERATOR FRAGMENTS WILL BE SYNTHESIZED HERE -->
        
        <!-- INLINE EDITORIAL GRAPHIC SLOT -->
        <figure class="my-10 border-l-2 border-[var(--c-primary)] pl-6">
          <div class="w-full aspect-video bg-[#0a0501] border border-[var(--c-primary)]/30 mb-3 bg-diagram bg-cover bg-center shadow-[0_0_15px_rgba(var(--c-primary-rgb),0.15)]"></div>
          <figcaption class="text-[9px] font-mono tracking-widest uppercase text-[var(--c-primary)] opacity-70">
            Fig 1. Schematic of the Layer 3 compliance engine.
          </figcaption>
        </figure>

        <p class="font-mono text-[10px] md:text-xs uppercase tracking-widest text-[var(--c-primary)]/50 pt-12 border-t border-[var(--c-primary)]/20">
          [ AWAITING NARRATIVE SYNTHESIS FROM FRAGMENTS WORKSPACE ]
        </p>
        <button class="mt-8 border border-[var(--c-primary)]/50 bg-[var(--c-primary)]/10 hover:bg-[var(--c-primary)] hover:text-[var(--c-void)] text-[var(--c-primary)] font-bold text-[10px] uppercase tracking-widest px-8 py-4 transition-colors w-full md:w-auto">
          Initialize Data Transfer
        </button>
      </div>
    </div>
  </main>

  <script>
    // Audio Player Injection Logic
    if (window.SERIES_AUDIO_TRACK) {
      const container = document.getElementById('audio-container');
      const player = document.getElementById('series-audio');
      container.classList.remove('hidden');
      container.classList.add('flex');
      player.src = window.SERIES_AUDIO_TRACK;
    }
  </script>
<script type="module" src="/src/sidebar.js"></script>

    <script type="module">
        import { trackPageview } from '/src/telemetry.js';
        trackPageview();
    </script>
</body>
</html>
