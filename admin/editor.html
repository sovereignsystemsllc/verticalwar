<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign OS // THE FORGE</title>
    <!-- Tailwind -->
    <link rel="stylesheet" href="/src/style.css">

    <!-- Quill.js Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <style>
        /* Industrial Noir Quill Styles */
        .ql-toolbar.ql-snow {
            border: 1px solid #1f2937 !important;
            background-color: #111827 !important;
        }

        .ql-container.ql-snow {
            border: 1px solid #1f2937 !important;
            background-color: black !important;
            min-height: 50vh;
        }

        .ql-editor {
            color: #d1d5db !important;
            font-family: inherit;
            font-size: 1.125rem;
            line-height: 1.75;
        }

        .ql-editor p,
        .ql-editor h1,
        .ql-editor h2,
        .ql-editor h3 {
            margin-bottom: 1em;
        }

        .ql-editor a {
            color: #00ff41 !important;
        }

        /* Override toolbar icons to be readable against dark bg */
        .ql-snow .ql-stroke {
            stroke: #9ca3af !important;
        }

        .ql-snow .ql-fill {
            fill: #9ca3af !important;
        }

        .ql-snow .ql-picker {
            color: #9ca3af !important;
        }
    </style>
</head>

<body class="pl-0 lg:pl-64 transition-all duration-300 bg-black text-gray-300 font-sans min-h-screen">
    <!-- CRT SCANLINE (RIKA AESTHETIC) -->
    <div class="scanline-overlay"></div>

    <div class="fixed top-0 w-full bg-gray-900 border-b border-gray-800 p-4 z-50 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <a href="/admin/curate"
                class="text-xs text-gray-500 hover:text-[#00ff41] transition tracking-widest uppercase">&lt; Back to
                Curation</a>
            <h1 class="text-[#00ff41] font-mono tracking-widest text-sm uppercase">The Forge</h1>
            <span id="saveStatus" class="text-xs text-gray-500 ml-4 font-mono hidden">SAVED</span>
        </div>
        <div class="flex gap-4">
            <button id="btnDelete"
                class="text-xs text-red-500 hover:text-white border border-red-900 px-4 py-2 hover:bg-red-900 transition tracking-widest uppercase">Delete
                Record</button>
            <button id="btnSave"
                class="text-xs text-black border border-[#00ff41] bg-[#00ff41] px-6 py-2 hover:bg-white hover:border-white transition font-bold tracking-widest uppercase">Save
                Changes</button>
        </div>
    </div>

    <div class="max-w-5xl mx-auto pt-24 pb-20 px-4">
        <form id="editorForm" class="space-y-6">
            <!-- Metadata Grid -->
            <div class="grid grid-cols-2 gap-6 bg-gray-900 p-6 border border-gray-800">
                <div class="col-span-2">
                    <label class="block text-xs text-[#00ff41] tracking-widest uppercase mb-1">Title</label>
                    <input type="text" id="iptTitle"
                        class="w-full bg-black border border-gray-700 text-white p-2 font-serif text-2xl focus:outline-none focus:border-[#00ff41]"
                        required>
                </div>

                <div class="col-span-2">
                    <label class="block text-xs text-[#00ff41] tracking-widest uppercase mb-1">Subtitle</label>
                    <input type="text" id="iptSubtitle"
                        class="w-full bg-black border border-gray-700 text-gray-400 p-2 focus:outline-none focus:border-[#00ff41]">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 tracking-widest uppercase mb-1">URL Slug</label>
                    <input type="text" id="iptSlug"
                        class="w-full bg-black border border-gray-700 text-gray-300 p-2 focus:outline-none focus:border-[#00ff41]"
                        placeholder="my-article-title">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 tracking-widest uppercase mb-1">Thumbnail</label>
                    <!-- Hidden ghost input — editor.js reads this for save -->
                    <input type="hidden" id="iptThumbnail" aria-hidden="true">
                    
                    <div class="flex items-start gap-3">
                        <div id="thumbnail-preview-wrap" class="hidden shrink-0">
                            <img id="thumbnail-preview" src="" alt="Thumbnail"
                                class="w-20 h-14 object-cover border border-gray-700">
                        </div>
                        <div class="flex flex-col gap-1 flex-1">
                            <div class="flex gap-2">
                                <button type="button" id="btn-upload-thumbnail"
                                    class="text-xs font-bold tracking-widest uppercase border border-[#00ff41]/50 text-[#00ff41]/70 hover:bg-[#00ff41] hover:text-black transition px-3 py-1.5 w-full text-left">
                                    📁 UPLOAD IMAGE
                                </button>
                                <button type="button" id="btn-extract-thumbnail"
                                    class="text-xs font-bold tracking-widest uppercase border border-[#00ff41]/50 text-[#00ff41]/70 hover:bg-[#00ff41] hover:text-black transition px-3 py-1.5 w-full text-left">
                                    🔍 EXTRACT FROM BODY
                                </button>
                            </div>
                            <span id="thumbnail-filename" class="text-[10px] text-gray-600 font-mono truncate">No file
                                selected</span>
                        </div>
                    </div>

                    <!-- Inline Image Extractor Grid -->
                    <div id="thumbnail-extractor-wrap" class="hidden mt-3 p-3 bg-gray-900 border border-gray-800">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] text-[#00ff41] tracking-widest uppercase">Select an image from the article</span>
                            <button type="button" id="btn-close-extractor" class="text-gray-500 hover:text-white px-2 py-1 text-sm font-bold">&times;</button>
                        </div>
                        <!-- Provide horizontal scrolling for multiple images -->
                        <div id="extractor-grid" class="flex gap-3 overflow-x-auto pb-2 scrollbar-thin scrollbar-thumb-gray-700">
                            <!-- JS injects images here -->
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 tracking-widest uppercase mb-1">Post Date</label>
                    <input type="datetime-local" id="iptDate"
                        class="w-full bg-black border border-gray-700 text-gray-300 p-2 focus:outline-none focus:border-[##00ff41]">
                </div>

                <div>
                    <label class="block text-xs text-gray-400 tracking-widest uppercase mb-1">Audience</label>
                    <select id="selAudience"
                        class="w-full bg-black border border-gray-700 text-gray-300 p-2 focus:outline-none focus:border-[#00ff41]">
                        <option value="everyone">Everyone</option>
                        <option value="only_paid">Only Paid</option>
                    </select>
                </div>

                <div class="col-span-2">
                    <label class="block text-xs text-gray-400 tracking-widest uppercase mb-1">Status</label>
                    <select id="selStatus"
                        class="w-full bg-black border border-gray-700 text-[#00ff41] p-2 focus:outline-none focus:border-[#00ff41]">
                        <option value="draft">Draft (Hidden)</option>
                        <option value="published">Published (Live)</option>
                    </select>
                </div>

                <!-- VIDEO EMBED — Full-width. Paste any YouTube or Rumble URL. -->
                <div class="col-span-2 border-t border-gray-800 pt-5 mt-1">
                    <label class="block text-xs text-[#00ff41] tracking-widest uppercase mb-1">
                        📺 Video Embed URL
                        <span class="text-gray-600 normal-case tracking-normal ml-2 text-[10px]">
                            — YouTube or Rumble watch URL. Leave empty to hide the embed.
                        </span>
                    </label>
                    <input type="url" id="iptVideoUrl"
                        class="w-full bg-black border border-gray-700 text-gray-300 p-2 focus:outline-none focus:border-[#00ff41] font-mono text-sm"
                        placeholder="https://www.youtube.com/watch?v=... or https://rumble.com/v...">
                    <p id="videoPreviewLabel"
                        class="hidden text-[10px] text-[#00ff41]/60 mt-1 font-mono tracking-widest">
                        ✓ EMBED RESOLVED — will render as hero video above article body
                    </p>
                </div>
            </div>

            <!-- Quill Editor Container -->
            <div>
                <label class="block text-xs text-[#00ff41] tracking-widest uppercase mb-1">Body Content</label>
                <div id="quill-editor"></div>
            </div>

        </form>
    </div>

    <!-- Hidden file input for Quill image uploads -->
    <input type="file" id="imageUploadInput" accept="image/*" class="hidden">
    <!-- Hidden file input for thumbnail upload -->
    <input type="file" id="thumbnailUploadInput" accept="image/*" class="hidden">

    <!-- Terminal Overlay for Logging -->
    <div id="statusTerminal"
        class="fixed bottom-6 right-6 w-96 max-w-[calc(100vw-3rem)] max-h-48 bg-black/90 border border-gray-800 rounded text-[#00ff41] font-mono text-xs p-3 overflow-y-auto hidden opacity-80 z-50 pointer-events-none transition-opacity duration-500 shadow-lg shadow-[#00ff41]/5">
        <div class="uppercase tracking-widest border-b border-gray-800 pb-1 mb-2 flex justify-between">
            <span>FORGE UPLINK</span>
            <span class="animate-pulse">●</span>
        </div>
        <div id="logContent" class="space-y-1"></div>
    </div>

    <!-- GLOBAL FOOTER -->
    <footer class="w-full border-t border-[#a78bfa]/30 bg-[#05010a]/90 text-center py-4 shrink-0 z-40 relative mt-auto">
        <p class="text-[9px] text-[#a78bfa]/40 tracking-[0.3em] uppercase font-mono">
            SOVEREIGN SYSTEM V4.0 // END OF TRANSMISSION
        </p>
    </footer>

    <script type="module" src="/admin/editor.js"></script>
<script type="module" src="/src/sidebar.js"></script>

    <script type="module">
        import { trackPageview } from '/src/telemetry.js';
        trackPageview();
    </script>
</body>

</html>
