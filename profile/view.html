<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USER PROFILE // SOVEREIGN OS</title>
        <link rel="stylesheet" href="/src/style.css">
</head>

<body
    class="pl-0 lg:pl-64 bg-[#05010a] text-white font-mono min-h-screen flex flex-col selection:bg-[#a78bfa] selection:text-black">
    <div class="scanline-overlay"></div>

    <nav
        class="w-full h-14 border-b border-[#a78bfa]/30 px-6 flex justify-between items-center bg-[#05010a]/90 z-50 sticky top-0 backdrop-blur-md shrink-0">
        <a href="/"
            class="text-[10px] font-bold text-[#a78bfa]/70 hover:text-[#a78bfa] tracking-[0.2em] border border-[#a78bfa]/20 hover:border-[#a78bfa]/50 px-3 py-1 uppercase transition-colors">[
            CODEX ]</a>
        <span id="page-subtitle" class="text-[9px] text-[#a78bfa]/40 tracking-widest uppercase">// OPERATOR FILE</span>
    </nav>

    <main class="flex-1 max-w-xl mx-auto w-full py-10 px-4">

        <div id="loading-state" class="flex items-center gap-3 py-20 justify-center">
            <div class="w-3 h-3 bg-[#a78bfa] rounded-full animate-ping"></div>
            <span class="text-xs text-[#a78bfa] tracking-widest animate-pulse uppercase">Decrypting record...</span>
        </div>

        <div id="not-found" class="hidden flex flex-col items-center justify-center py-20 gap-4 text-center">
            <div class="text-4xl">👻</div>
            <p class="text-xs text-white/40 tracking-widest uppercase">No operator found at this address.</p>
            <a href="/"
                class="text-[9px] font-bold border border-[#a78bfa]/40 text-[#a78bfa] px-4 py-2 hover:bg-[#a78bfa] hover:text-black transition-colors tracking-widest uppercase">RETURN
                TO CODEX</a>
        </div>

        <div id="profile-view" class="hidden">
            <!-- Avatar + Identity -->
            <div class="flex items-center gap-6 mb-8">
                <div id="avatar-display"
                    class="w-20 h-20 rounded-full border-2 border-[#a78bfa]/40 flex items-center justify-center text-2xl font-bold text-[#a78bfa] bg-[#a78bfa]/10 overflow-hidden shrink-0">
                </div>
                <div class="min-w-0">
                    <div id="display-name" class="text-xl font-bold text-white tracking-wide"></div>
                    <div id="username" class="text-xs text-[#a78bfa]/60 tracking-widest mt-0.5"></div>
                    <div id="role-badge"
                        class="mt-2 inline-block text-[9px] font-bold px-2 py-0.5 border tracking-widest uppercase">
                    </div>
                    <div id="joined-date" class="text-[9px] text-white/20 tracking-widest mt-1 uppercase"></div>
                </div>
            </div>

            <!-- Bio -->
            <div id="bio-block" class="hidden bg-[#0a0a0a] border border-[#a78bfa]/20 p-5 mb-4">
                <p class="text-[9px] text-[#a78bfa]/40 tracking-[0.3em] uppercase mb-3">// TRANSMISSION</p>
                <p id="bio-text" class="text-sm text-white/70 leading-relaxed"></p>
            </div>
        </div>

    </main>

    <script type="module" src="/profile/view.js"></script>
    <script type="module" src="/src/fx.js"></script>
    <script type="module" src="/src/sidebar.js"></script>
</body>

</html>
